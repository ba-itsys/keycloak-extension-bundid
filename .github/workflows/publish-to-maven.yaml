name: Publish to Maven Central

on:
  push:
    tags:
      - '**'
  workflow_dispatch: { }

permissions:
  contents: read
  packages: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
          server-id: central # Maven Central (Sonatype)
          server-username-env-var: MAVEN_USERNAME # env variable reference in settings.xml
          server-password-env-var: MAVEN_PASSWORD # env variable reference in settings.xml
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }} # Value of the GPG private key to import
          gpg-passphrase-env-var: GPG_PASSPHRASE # env variable reference for the GPG private key

      - name: Publish package
        run: mvn --batch-mode -Ppublish deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
